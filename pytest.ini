[pytest]
# Fix 3 (taakrapport, live-fixes-report.md): `load_dotenv()` in `geluidsmeter/api.py` zet
# DSO_API_KEY uit `.env` in os.environ zodra één testbestand `api` importeert -- en vrijwel elk
# testbestand doet dat. Een `skipif(not os.environ.get("DSO_API_KEY"))` las daardoor nooit de
# shell van de uitvoerder, maar altijd de staat ná die import: met `.env` gesourcet (vereist voor
# de rest van de suite) stond de sleutel er al, dus liepen de vijf *_live.py-bestanden altijd mee,
# ook in een gewone `pytest tests/ -q`.
#
# De vervanging is een eigen marker (`live`), losgekoppeld van elke omgevingsvariabele: hij is
# standaard uit (zie `tests/conftest.py`, `pytest_collection_modifyitems`) en gaat alleen aan met
# `pytest --run-live`. `strict_markers` laat dit luid falen als een toekomstig testbestand de
# marker verkeerd typt (bv. `pytest.mark.liev`) -- in plaats van hem stilzwijgend als onbekend te
# negeren en dus altijd te laten meedraaien, exact de fout die hier wordt rechtgezet.
#
# Let op: `addopts = --strict-markers` doet hier NIETS (geverifieerd met pytest 9.0.3, ook in een
# losstaande reproductie buiten deze repo) -- de vlag via addopts wordt te laat toegepast om de
# markervalidatie bij het collecteren nog te raken, terwijl `--strict-markers` rechtstreeks op de
# commandline of `-o strict_markers=true` wél werkt. Daarom staat het hier als eigen ini-sleutel,
# niet in `addopts`.
strict_markers = true
markers =
    live: raakt een echte externe bron over het netwerk (DSO/PDOK/Atlas/WKP) of een zware lokale
        bron. Staat standaard uit; aanzetten met `pytest --run-live`. Zie tests/conftest.py.
