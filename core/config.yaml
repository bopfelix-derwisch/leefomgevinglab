  rev:
    ogc_base_url: "https://api.pdok.nl/rws/productie-en-industrie-productiefaciliteiten/ogc/v1"
    # Productiefaciliteiten zijn per sector over meerdere collections verdeeld;
    # de connector voegt ze samen en tagt elk object met property rev_sector.
    collections:
      - production_facility_c   # Productie
      - production_facility_h   # Transport en opslagdiensten
      - production_facility_e   # Watervoorziening, riolering, afvalbeheer, sanering
      - production_facility_d   # Stroom, gas, stoom, airco
      - production_facility_b   # Winning van delfstoffen
      - production_facility_f   # Bouw
    max_features: 500
  externe_veiligheid:
    # REV-EXPLOSIEaandachtsgebieden via de open REV GeoServer WFS (rev-portaal.nl). CQL INTERSECTS op
    # RD/EPSG:28992-punt (lon/lat geeft stil 0 treffers). lagen = herkomst -> explosie-laag.
    wfs_url: "https://rev-portaal.nl/geoserver/wfs"
    max_features: 5
    lagen:
      inrichting: "rev_public:ev_explosieaandachtsgebieden"   # propaantanks, tankstations, ...
      buisleiding: "rev_public:bl_explosieaandachtsgebieden"
      basisnet: "rev_public:bn_explosieaandachtsgebieden"
  wfs_kwaliteit:
    # Datakwaliteit-scan op de open REV WFS (rev-portaal.nl). Álle lagen worden dynamisch ontdekt
    # via GetCapabilities (namespace 'rev_public:'). Totaal exact via resultType=hits (met optioneel
    # CQL-filter per bronhouder/activiteit); geometrie-validiteit + null-rates uit een sample per laag.
    wfs_url: "https://rev-portaal.nl/geoserver/wfs"
    namespace: "rev_public:"
    sample_n: 300
    cache_ttl_s: 86400     # 1 dag per filter-combinatie; ?refresh=1 forceert een verse scan
    # lagen: []  # leeg = alle lagen dynamisch uit GetCapabilities
    # IMEV 3.0.2 base-verplichte attributen (ExterneVeiligheidsobject), gemapt op WFS-veldnamen.
    imev_verplichte_velden:
      - "identificatie"
      - "bronhoudercode"
      - "bevoegdgezag"       # bevoegdGezagCode; alleen geëvalueerd waar ontsloten (o.a. ev_activiteiten)
      - "begin_geldigheid"
      - "tijdstip_registratie"
  ozon:
    # DSO Ozon Omgevingsdocument Presenteren v8 (x-api-key; RD via Content-Crs OGC-URI).
    # Omgeving instelbaar (pre|prod); prod gebruikt DSO_API_KEY_PROD uit .env (zelfde helper als DSO).
    # NB: 'welke regelingen gelden hier' werkt betrouwbaar op prod; artikel-niveau is een vervolg-spike.
    api_key_header: "x-api-key"
    environment: "prod"
    max_regelingen: 3
    max_regelteksten: 5
    pre:
      base_url: "https://service.pre.omgevingswet.overheid.nl/publiek/omgevingsdocumenten/api/presenteren/v8"
    prod:
      base_url: "https://service.omgevingswet.overheid.nl/publiek/omgevingsdocumenten/api/presenteren/v8"
  dso:
    # DSO Toepasbare Regels. Omgeving per service instelbaar (pre|prod); de key komt uit .env:
    # DSO_API_KEY = pre-key, DSO_API_KEY_PROD = productie-key. Header x-api-key.
    # Geometrie in RD/EPSG:28992. Zie spec 2026-06-22-dso-regels-resolver-design.md.
    # NB: de volledige keten (Zoek + RTR + Uitvoeren) staat op productie.
    api_key_header: "x-api-key"
    zoek_env: "prod"
    rtr_env: "prod"
    uitvoeren_env: "prod"
    pre:
      zoek_base_url: "https://service.pre.omgevingswet.overheid.nl/publiek/toepasbare-regels/api/zoekinterface/v2"
